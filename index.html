<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Loja</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0c;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 40px 20px;
    }

    .shop-container {
        position: relative;
        z-index: 1;
        border-radius: 12px;
        max-width: 1100px;
        width: 100%;
        overflow: hidden;
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9),
                    0 0 0 1px rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ---------- Barra estilo navegador ---------- */
    .browser-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 40px;
        padding: 0 14px;
        background: linear-gradient(to bottom, #2a2a2e, #1c1c1f);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
    }
    .dot.red    { background: #ff5f57; }
    .dot.yellow { background: #febc2e; }
    .dot.green  { background: #28c840; }

    .url-bar {
        flex: 1;
        margin-left: 12px;
        height: 24px;
        line-height: 24px;
        padding: 0 12px;
        background: #151517;
        border-radius: 6px;
        font-size: 12px;
        color: #b8b8b8;
        font-family: monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    /* ---------- Área de conteúdo ---------- */
    .shop-content {
        padding: 30px 35px;
        background: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWecePT-B_HPcUnlWlUs0dHAUIlvwjIKOaKmhCHZpqTA&s=10") center/cover no-repeat;
        backdrop-filter: blur(4px);
        background-color: rgba(0, 0, 0, 0.4);
        min-height: 200px;
        color: #fff;
    }

    .shop-content h1 {
        font-size: 28px;
        margin-bottom: 10px;
    }

    .shop-content p {
        font-size: 14px;
        color: #d0d0d0;
    }
</style>
</head>
<body>

    <div class="shop-container">
        <div class="browser-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <div class="url-bar">🔒 https://seusite.com/shop</div>
        </div>
        <div class="shop-content">
            <h1>Minha Loja</h1>
            <p>Bem-vindo à loja!</p>
        </div>
    </div>

</body>
</html>
